; ---------------------------------------------------------------------------
; Diagnostic build: drives the ST7305 panel with nothing else running.
; Same board configuration as the bongo cat firmware, so if this lights the
; panel up and the bongo cat build does not, the panel itself is fine.
;
; Build with:  pio run
; ---------------------------------------------------------------------------
[platformio]
src_dir = .

[env:esp32-s3-panel-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu        = esp32s3
board_build.f_cpu      = 240000000L
board_build.f_flash    = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = ../bongocat_rlcd/partitions.csv
board_upload.flash_size  = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    olikraus/U8g2 @ ^2.36.5

upload_speed  = 921600
monitor_speed = 115200
monitor_filters = direct, time
