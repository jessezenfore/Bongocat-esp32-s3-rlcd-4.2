; ---------------------------------------------------------------------------
; Bongo Cat PC monitor for the Waveshare ESP32-S3-RLCD-4.2
;
; The board options below mirror Waveshare's own Arduino IDE settings:
;   Board ................ ESP32S3 Dev Module
;   USB CDC On Boot ...... Enabled
;   CPU Frequency ........ 240MHz (WiFi)
;   Flash Mode ........... QIO 80MHz
;   Flash Size ........... 16MB (128Mb)
;   Partition Scheme ..... 16M Flash (3MB APP/9.9MB FATFS)
;   PSRAM ................ OPI PSRAM
;   Upload Speed ......... 921600
;   USB Mode ............. Hardware CDC and JTAG
;
; `src_dir = .` lets this folder double as an Arduino IDE sketch folder:
; open bongocat_rlcd.ino in the IDE, or run `pio run -t upload` here.
; ---------------------------------------------------------------------------
[platformio]
src_dir = .

[env:esp32-s3-rlcd-42]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu        = esp32s3
board_build.f_cpu      = 240000000L
board_build.f_flash    = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
; Arduino IDE's "16M Flash (3MB APP/9.9MB FATFS)" table, shipped locally so the
; PlatformIO and Arduino IDE builds use an identical layout.
board_build.partitions = partitions.csv
board_upload.flash_size  = 16MB
board_upload.maximum_size = 16777216

; Native USB-CDC on the ESP32-S3 ("Hardware CDC and JTAG" + CDC on boot).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

; The generated artwork is one 400x232 XBM per frame (7 frames, ~81 KB total),
; so the binary is chunky -- but the 3 MB application partition has room to spare.
lib_deps =
    olikraus/U8g2 @ ^2.36.5

upload_speed  = 921600
monitor_speed = 115200
monitor_filters = direct, time
